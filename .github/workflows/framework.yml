name: Framework checks

on: [push, pull_request]

jobs:
  framework:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -e '.[mavlink]' -r requirements-vision.txt
      - run: python -m compileall -q src tests scripts
      - run: python -m unittest discover -s tests -v
      - run: node tests/web_console_smoke.cjs
      - run: vehicle-autonomy status
      - run: vehicle-autonomy-hardware --check
