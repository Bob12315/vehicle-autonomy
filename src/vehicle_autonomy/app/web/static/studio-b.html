<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务编排 · 车辆自主系统</title><link rel="stylesheet" href="/tool-console.css"><link rel="stylesheet" href="/studio-b.css"><script defer src="/auth.js"></script><script defer src="/navigation.js"></script><script defer src="/studio-library.js"></script><script defer src="/studio-canvas.js"></script><script defer src="/studio-params.js"></script><script defer src="/studio-b.js"></script></head>
<body><aside class="sidebar" data-navigation><p role="status">正在加载导航…</p></aside>
<div class="shell"><header class="topbar"><span>任务编排 <span id="save-state" class="badge" role="status">正在恢复会话</span></span><div class="studio-toolbar"><select id="vehicle" aria-label="当前车辆"></select><select id="studio-language" aria-label="动作库语言" data-original-text><option value="zh-CN">简体中文</option><option value="en-US">English</option></select><button data-logout>退出登录</button></div></header>
<main><div class="page-heading"><div><p class="eyebrow">任务工作区</p><h1 id="page-title">任务库</h1><p class="muted" id="subtitle">从草稿、发布版本或模板开始。</p></div><button id="new-mission" class="primary">＋ 新建任务</button></div>
<div id="notice" role="status" aria-live="polite"></div><div class="studio-tabs" role="navigation" aria-label="任务工作区"><button data-tab="library">任务库</button><button data-tab="editor">编辑器</button><button data-tab="runner">运行监控</button><button data-tab="history">历史记录</button><button data-tab="templates">模板</button></div>
<section id="library-view"><div class="studio-toolbar"><input id="library-search" type="search" placeholder="搜索名称、ID 或标签" aria-label="搜索任务"><select id="kind-filter" aria-label="车型筛选"><option value="">全部车型</option><option value="rover">地面车</option><option value="copter">多旋翼</option><option value="plane">固定翼</option></select><button id="refresh-library">刷新</button><label class="file-button">导入 JSON<input id="import-file" type="file" accept=".json,application/json"></label></div><div id="library-items" class="library-grid"></div></section>
<section id="editor-view" hidden><div id="breadcrumbs" class="studio-toolbar"></div><div class="studio-toolbar document-bar"><label>名称<input id="mission-name"></label><label>版本<input id="mission-version" placeholder="1.0.0"></label><label>验证实例（发布后仍需绑定）<select id="mission-target"></select></label><button id="save-draft">保存</button><button id="validate">验证</button><button id="publish" class="primary">发布版本</button><button id="export">导出</button><button id="save-template">存为模板</button></div>
<div class="studio-ide"><aside class="panel action-library"><h2>动作库</h2><input id="palette-search" type="search" placeholder="搜索节点 / 动作"><div id="palette"></div></aside><section class="panel canvas-panel"><div class="studio-toolbar canvas-toolbar"><button id="undo">撤销</button><button id="redo">重做</button><button id="layout">布局</button><button id="copy">复制</button><button id="paste">粘贴</button><button id="delete">删除</button><button id="group">分组</button><button id="extract">组合为子任务</button><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-in" aria-label="放大">＋</button><button id="fit">复位</button></div><div id="graph-viewport" tabindex="0" aria-label="任务图画布"><div id="graph-stage"><svg id="graph-edges" aria-label="执行连线"></svg><div id="graph-nodes"></div></div><div id="selection-box" hidden></div></div><p class="canvas-caption">拖动端口连线 · Shift 多选 / 框选 · 空白处平移 · 滚轮缩放 · 双击子任务进入</p></section><aside class="panel studio-properties"><h2 id="property-title">节点属性</h2><div id="properties"><p class="muted">选择节点查看参数与输入输出。</p></div></aside></div>
<details class="panel"><summary>任务设置与共享变量声明</summary><div id="mission-properties"></div></details></section>
<section id="runner-view" hidden><div class="panel"><div class="studio-toolbar"><select id="publication" aria-label="发布版本"></select><select id="run-target" aria-label="实际执行车辆实例"></select><label class="inline-check"><input id="send" type="checkbox">授权本次运行 SEND</label><label class="inline-check"><input id="debug-run" type="checkbox">调试运行</label><button id="run-start" class="primary">运行发布版本</button><select id="run-select" aria-label="运行实例"></select></div><p id="run-target-identity" role="status">请明确选择当前在线车辆实例</p><div class="studio-toolbar run-controls"><button data-debug="pause">安全暂停</button><button data-debug="resume">重新验证并恢复</button><button data-debug="step">单步</button><button data-debug="retry">重试所选节点</button><button data-debug="skip">跳过所选节点</button><button id="runtime-override">调整待执行参数</button><button id="run-cancel" class="danger">取消 / 安全收尾</button><button id="run-takeover" class="danger">人工接管</button></div><p id="run-state" role="status">请选择一个运行实例。API 接受与实际执行结果分别显示。</p><div id="runner-breadcrumbs" class="studio-toolbar"></div><div id="runner-canvas-host"></div></div></section>
<section id="history-view" hidden><div id="history-items"></div></section>
<section id="inspector" class="panel"><div class="studio-toolbar"><h2>数据检查</h2><button data-inspect="blackboard">共享变量</button><button data-inspect="events">执行事件</button><button data-inspect="diagnostics">诊断</button><button data-inspect="definition">任务定义</button><label>历史事件位置<input id="history-position" type="range" min="0" max="0" value="0"></label></div><div id="inspector-content"><p class="muted">选择运行实例，查看来源、输入输出、事件与确认结果。</p></div></section>
</main></div><dialog id="studio-dialog"><form method="dialog"><h2 id="dialog-title"></h2><div id="dialog-content"></div><div class="studio-toolbar"><button value="cancel">取消</button><button id="dialog-confirm" value="confirm" class="primary">确定</button></div></form></dialog></body></html>
