<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vehicle Autonomy · Action Lab</title><link rel="stylesheet" href="/action-lab.css"><script defer src="/auth.js"></script><script defer src="/action-lab.js"></script>
<header><h1>Action Lab</h1><p>独立 Action 测试 · 仅明确授权的项目自有仿真</p><span>统一会话已登录</span><button id="connect">连接</button><span id="connection">未连接</span><button data-logout type="button">退出登录</button></header>
<main><section><h2>车辆与权限</h2><select id="vehicle"></select><pre id="vehicle-info"></pre><h2>Action</h2><select id="action"></select><p id="description"></p><p id="semantics"></p><form id="parameters"></form><label>超时（秒）<input id="timeout" type="number" min="0.1" step="0.1"></label><label>资源等待（秒）<input id="wait" type="number" min="0" max="60" value="0"></label><label>明确衔接的旧 Action ID（可选）<input id="continuation"></label><label><input id="send" type="checkbox">授权本次 Action SEND（默认关闭）</label><button id="run">运行 Action</button><p id="error" role="alert"></p></section><section><h2>实例与反馈</h2><p>Action 状态、命令状态和物理停止证据分别显示。UNKNOWN / UNCONFIRMED 会保留资源。</p><div id="instances"></div><h2>资源占用</h2><pre id="resources"></pre></section></main></html>
