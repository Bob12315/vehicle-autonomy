<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Studio</title><link rel="stylesheet" href="/mission-ui.css"><script defer src="/mission-api.js"></script><script defer src="/mission-studio.js"></script></head><body>
<header><h1>Mission Studio</h1><nav><a href="/control">Control Center</a><a href="/">Action Lab</a></nav><input id="token" type="password" placeholder="Private access token" autocomplete="off"><button id="connect">连接</button><select id="target" aria-label="目标车辆"></select></header>
<main><div id="notice" role="status"></div><div class="toolbar"><input id="mission-id" value="mission" aria-label="Mission ID"><input id="mission-name" value="New Mission" aria-label="任务名"><input id="mission-version" value="1.0.0" aria-label="版本"><input id="mission-timeout" type="number" value="600" min="0.1" max="1800" aria-label="任务总期限秒"><button id="validate">校验</button><button id="save">保存版本</button><select id="library" aria-label="已保存版本"></select><button id="load">加载</button><button id="export">导出 JSON</button><label>导入 JSON<input id="import" type="file" accept="application/json,.json"></label></div>
<div class="toolbar"><button id="undo">撤销</button><button id="redo">重做</button><button id="layout">自动布局</button><button id="zoom-in">放大</button><button id="zoom-out">缩小</button><button id="fit">视图复位</button><button id="connect-nodes">连线：点击父节点，再点子节点</button><button id="root">设为根</button><button id="delete">删除选中节点</button><label class="check"><input id="send" type="checkbox">本次 Mission SEND</label><input id="continuation" placeholder="Plane continuation Action ID"><button id="start" class="primary">运行 Mission</button><button id="cancel" class="danger">取消 / 请求安全退出</button></div>
<div class="workspace"><aside class="panel"><h2>节点库</h2><div id="palette" class="palette"></div><h2>Action 能力库</h2><select id="action-library" aria-label="Action 能力"></select><button id="add-action">添加 Action</button><p class="muted">拖拽节点调整布局。父节点的连线顺序决定 Sequence 和分支顺序。运行时固定版本；编辑草稿不改变当前任务。</p></aside>
<section class="panel graph-view" id="graph-view"><div id="graph" class="graph-content"><svg id="edges"></svg><div id="nodes"></div></div></section><aside class="panel properties"><h2>节点属性</h2><div id="properties">选择节点</div><h2>校验 / 运行状态</h2><pre id="validation"></pre><select id="runs" aria-label="运行历史"></select><input id="history-position" type="range" min="0" max="0" value="0" aria-label="历史回放位置"><pre id="run-detail"></pre></aside></div>
<details><summary>Mission JSON / 节点连接（可编辑后导入草稿）</summary><textarea id="json" aria-label="Mission JSON"></textarea><button id="apply-json">应用 JSON 草稿</button></details><section class="panel"><h2>Action 反馈与任务日志</h2><pre id="feedback"></pre></section></main></body></html>
