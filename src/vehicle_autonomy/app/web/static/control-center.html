<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工具与系统 · 车辆自主系统</title><link rel="stylesheet" href="/tool-console.css"><script defer src="/auth.js"></script><script defer src="/navigation.js"></script><script defer src="/control-center.js"></script></head>
<body class="center-page"><aside class="sidebar" data-navigation><p role="status">正在加载导航…</p></aside>
<div class="shell"><header class="topbar"><span id="connection" role="status">正在连接控制台</span><button data-logout>退出登录</button></header><main><div class="page-heading"><div><p class="eyebrow">CONTROL CENTER</p><h1>工具与系统</h1><p class="muted">选择场景与车辆，再按需打开桌面工具。关闭图形窗口可保留仿真。</p></div><a href="/simulation" class="primary">选择场景与车辆 ↗</a></div><p id="notice" role="status" aria-live="polite"></p>
<article class="panel"><div class="panel-title"><h2>当前仿真</h2><a href="/simulation">创建 / 切换场景 ↗</a></div><div class="form-grid"><label>运行中的 World<select id="world"><option value="">尚无仿真</option></select></label><label>RViz2 车辆 Profile<select id="target"><option value="">空白观察窗口</option></select></label></div><p id="simulation-hint" class="muted">启动控制台不会自动创建仿真。</p><div class="toolbar"><a id="vehicle-control" href="/control">打开车辆控制 ↗</a><button id="stop-simulation" disabled>结束选中仿真</button></div></article>
<div class="section-heading"><h2>工具中心</h2><button id="stop-all" disabled>关闭全部工具</button></div><div id="tools"><p class="muted" role="status">正在检查本机工具与进程…</p></div><p class="muted">RViz2 使用真实遥测。未连接的点云、地图和外部路径保持关闭。QGC 只接收自有 SITL 遥测，无法经此连接控制车辆。</p><article class="panel" id="tool-logs"><div class="panel-title"><h2>工具日志</h2><button id="refresh-log" disabled>刷新日志</button></div><label>日志来源<select id="log-tool"><option value="gazebo-gui">Gazebo GUI</option><option value="rviz2">RViz2</option><option value="qgroundcontrol">QGroundControl</option><option value="visualization-bridge">遥测可视化桥</option></select></label><pre id="logs">选择工具读取日志。</pre></article>
<article class="panel" id="system-panel"><div class="panel-title"><h2>系统控制</h2><button id="shutdown" disabled class="danger">关闭整个控制台</button></div><dl id="system" class="data-list"></dl><details><summary>后台与受管进程</summary><pre id="processes"></pre></details><details><summary>图形环境与工具注册表</summary><pre id="environment"></pre></details><p class="muted">退出时先关闭任务与仿真，再关闭工具。活动车辆请先在车辆控制页安全退出并释放 SEND。</p></article></main></div></body></html>
